[project]
name = "jincsae"
version = "0.1.0"
description = "Jornalista Inclusivo Social Automation Engine"
authors = [
    { name = "Jornalista Inclusivo" }
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
    "testcontainers>=4.0.0"
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["gate1"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["gate1"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
norecursedirs = ["gate1"]
asyncio_mode = "auto"
pythonpath = ["src"]
